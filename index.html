<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karaoke Song Picker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="images_data.js"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden" onload="initApp()">

    <header class="glass sticky top-0 z-20 px-4 py-3 flex flex-col md:flex-row gap-3 items-center justify-between shadow-xl">
        <div class="flex items-center gap-3 w-full md:w-auto justify-between">
            <h1 class="text-xl font-bold tracking-wider text-indigo-400 flex items-center gap-2">
                <i class="fa-solid fa-microphone-lines text-pink-500"></i> KARAOKE HUB
            </h1>
            <div class="flex items-center gap-2">
                <label class="cursor-pointer bg-indigo-600 hover:bg-indigo-500 text-xs px-3 py-2 rounded-lg font-semibold transition flex items-center gap-2">
                    <i class="fa-solid fa-file-import"></i> <span id="importBtnLabel">Import Playlist</span>
                    <input type="file" id="excelFile" accept=".xlsx, .xls" class="hidden" onchange="handleFileSelect(event)">
                </label>

                <button onclick="pickRandomSong()" class="bg-amber-600 hover:bg-amber-500 text-white text-xs px-2.5 py-2 rounded-lg font-semibold transition flex items-center gap-1.5 shadow">
                    <i class="fa-solid fa-shuffle"></i> Random
                </button>

                <button onclick="openSettingsModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs px-2.5 py-2 rounded-lg font-semibold transition flex items-center gap-1.5">
                    <i class="fa-solid fa-gear"></i> Sync Settings
                </button>
            </div>
        </div>

        <div class="relative w-full md:w-96 flex items-center gap-1.5">
            <div class="relative flex-1">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input type="text" id="searchInput" oninput="handleSearch()" onkeydown="if(event.key==='Enter') executeSearch()" placeholder="Search artist, song, or album..." 
                       class="w-full bg-slate-900/80 border border-slate-700 rounded-xl pl-9 pr-4 py-2 text-sm focus:outline-none focus:border-indigo-500 transition">
            </div>
            <button onclick="executeSearch()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs px-3.5 py-2.5 rounded-xl font-semibold transition shrink-0">Search</button>
        </div>

        <div class="flex items-center gap-2 w-full md:w-auto justify-center overflow-x-auto hide-scrollbar">
            <button onclick="showArtistsView()" id="tab-artists" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-indigo-600 text-white transition">Artists</button>
            <button onclick="showAllSongsView()" id="tab-all" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 transition">All Songs</button>
            <button onclick="showFavsView()" id="tab-favs" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 transition">Favorites (<span id="favCount">0</span>)</button>
            <button onclick="showRecentsView()" id="tab-recents" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 transition">Recents</button>
        </div>
    </header>

    <div id="syncToast" class="hidden fixed bottom-4 right-4 z-50 bg-indigo-600 text-white text-xs px-4 py-2.5 rounded-xl shadow-2xl items-center gap-2 font-semibold">
        <i class="fa-solid fa-circle-notch animate-spin"></i> <span id="syncToastText">Syncing with GitHub...</span>
    </div>

    <div id="artistBreadcrumb" class="hidden glass px-6 py-2.5 flex items-center justify-between border-b border-slate-800">
        <button onclick="showArtistsView()" class="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg text-slate-200 font-semibold flex items-center gap-2">
            <i class="fa-solid fa-arrow-left"></i> Back to Artists
        </button>
        <div class="flex items-center gap-2">
            <span id="selectedArtistName" class="text-base font-bold text-indigo-400"></span>
            <span id="selectedArtistCount" class="text-xs bg-indigo-600/30 text-indigo-300 px-2.5 py-0.5 rounded-full font-semibold"></span>
        </div>
    </div>

    <main class="flex-1 overflow-y-auto p-4 md:p-6">
        <div id="mainContainer"></div>
        <div id="emptyState" class="hidden flex-col items-center justify-center py-20 text-slate-500">
            <i class="fa-solid fa-compact-disc text-5xl mb-3 animate-spin"></i>
            <p id="emptyMessage" class="text-sm">Loading database...</p>
        </div>
    </main>

    <div id="settingsModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
        <div class="glass max-w-md w-full rounded-2xl p-6 shadow-2xl relative border border-slate-700">
            <button onclick="closeSettingsModal()" class="absolute top-3 right-3 text-slate-400 hover:text-white p-2 text-sm"><i class="fa-solid fa-xmark"></i></button>
            <h3 class="text-lg font-bold text-white mb-1"><i class="fa-solid fa-cloud-arrow-up text-indigo-400 mr-2"></i>GitHub Database Sync</h3>
            <p class="text-xs text-slate-400 mb-4">Enter your GitHub credentials once to automatically save edits back to your repository's <code class="text-indigo-300">songs.json</code> file.</p>
            
            <div class="space-y-3 text-xs">
                <div>
                    <label class="block text-slate-300 mb-1 font-semibold">GitHub Username</label>
                    <input type="text" id="ghOwner" placeholder="e.g. jondoe" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white">
                </div>
                <div>
                    <label class="block text-slate-300 mb-1 font-semibold">Repository Name</label>
                    <input type="text" id="ghRepo" placeholder="e.g. karaoke-hub" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white">
                </div>
                <div>
                    <label class="block text-slate-300 mb-1 font-semibold">Personal Access Token (Fine-Grained)</label>
                    <input type="password" id="ghToken" placeholder="github_pat_..." class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white">
                </div>
            </div>

            <div class="flex gap-2 mt-6">
                <button onclick="saveSettings()" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white py-2 rounded-xl text-xs font-semibold">Save Settings</button>
                <button onclick="closeSettingsModal()" class="bg-slate-800 text-slate-300 px-4 py-2 rounded-xl text-xs font-semibold">Cancel</button>
            </div>
        </div>
    </div>

    <div id="randomModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
        <div class="glass max-w-md w-full rounded-2xl p-6 flex flex-col items-center text-center shadow-2xl relative border border-slate-700">
            <button onclick="closeRandomModal()" class="absolute top-3 right-3 text-slate-400 hover:text-white p-2 text-sm"><i class="fa-solid fa-xmark"></i></button>
            <div class="text-amber-500 font-bold text-xs uppercase tracking-wider mb-3"><i class="fa-solid fa-dice mr-1"></i> Random Pick</div>
            <div id="randomImageContainer" class="w-32 h-32 rounded-xl overflow-hidden mb-4 bg-slate-800 flex items-center justify-center border border-slate-700"></div>
            <h3 id="randomSongTitle" class="text-lg font-bold text-white mb-1"></h3>
            <p id="randomSongArtist" class="text-sm text-indigo-400 font-semibold mb-1"></p>
            <p id="randomSongAlbum" class="text-xs text-slate-400 font-medium mb-6 flex items-center gap-1"><i class="fa-solid fa-compact-disc"></i> <span></span></p>
            <div class="flex items-center gap-3 w-full">
                <button onclick="pickRandomSong()" class="flex-1 bg-slate-800 text-slate-200 py-2.5 rounded-xl font-semibold text-xs border border-slate-700">Pick Another</button>
                <button id="randomPlayBtn" class="flex-1 bg-indigo-600 text-white py-2.5 rounded-xl font-semibold text-xs">Play Karaoke</button>
            </div>
        </div>
    </div>

    <script>
        let songs = [];
        let favorites = new Set(JSON.parse(localStorage.getItem('karaoke_favs') || '[]').map(String));
        let recents = JSON.parse(localStorage.getItem('karaoke_recents') || '[]');
        let currentMode = 'artists'; 
        let selectedArtist = null;

        function generateSongId(artist, title) {
            const raw = `${artist}-${title}`.toLowerCase();
            return raw.replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
        }

        async function initApp() {
            document.getElementById('ghOwner').value = localStorage.getItem('gh_owner') || '';
            document.getElementById('ghRepo').value = localStorage.getItem('gh_repo') || '';
            document.getElementById('ghToken').value = localStorage.getItem('gh_token') || '';

            try {
                const response = await fetch('songs.json?cache_bust=' + Date.now());
                if (response.ok) {
                    songs = await response.json();
                    showArtistsView();
                    return;
                }
            } catch (e) {
                console.warn("Could not fetch hosted songs.json, trying local fallback", e);
            }

            const cached = localStorage.getItem('karaoke_cached_songs');
            if (cached) {
                songs = JSON.parse(cached);
                showArtistsView();
            } else {
                render();
            }
        }

        async function saveToGitHub(newSongsList) {
            const owner = localStorage.getItem('gh_owner');
            const repo = localStorage.getItem('gh_repo');
            const token = localStorage.getItem('gh_token');

            localStorage.setItem('karaoke_cached_songs', JSON.stringify(newSongsList));

            if (!owner || !repo || !token) {
                console.warn("GitHub sync credentials missing. Edits saved to current browser only.");
                return;
            }

            const toast = document.getElementById('syncToast');
            const toastText = document.getElementById('syncToastText');
            toast.classList.remove('hidden');
            toast.classList.add('flex');
            toastText.innerText = "Syncing changes to GitHub...";

            try {
                const getFile = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/songs.json`, {
                    headers: { 'Authorization': `token ${token}` }
                });

                let sha = "";
                if (getFile.ok) {
                    const data = await getFile.json();
                    sha = data.sha;
                }

                const content = btoa(unescape(encodeURIComponent(JSON.stringify(newSongsList, null, 2))));
                const putResponse = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/songs.json`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: 'Update songs.json via Karaoke Web App',
                        content: content,
                        sha: sha !== "" ? sha : undefined
                    })
                });

                if (putResponse.ok) {
                    toastText.innerText = "Synced to GitHub!";
                    setTimeout(() => toast.classList.add('hidden'), 2500);
                } else {
                    throw new Error('API returned ' + putResponse.status);
                }
            } catch (err) {
                console.error("GitHub Sync Failed:", err);
                toastText.innerText = "Sync failed. Check API Token.";
                setTimeout(() => toast.classList.add('hidden'), 4000);
            }
        }

        function openSettingsModal() { document.getElementById('settingsModal').classList.remove('hidden'); }
        function closeSettingsModal() { document.getElementById('settingsModal').classList.add('hidden'); }

        function saveSettings() {
            localStorage.setItem('gh_owner', document.getElementById('ghOwner').value.trim());
            localStorage.setItem('gh_repo', document.getElementById('ghRepo').value.trim());
            localStorage.setItem('gh_token', document.getElementById('ghToken').value.trim());
            closeSettingsModal();
            alert("Sync Settings saved!");
        }

        function cleanArtistName(rawName) { return rawName.split(/ feat\.?| ft\.?| & |,|\/| starring/i)[0].trim(); }
        function getArtistBase64Image(rawArtistName) {
            const cleanKey = cleanArtistName(rawArtistName).replace(/[^a-zA-Z0-9_\-]/g, '_').toLowerCase();
            return (window.ARTIST_IMAGES && window.ARTIST_IMAGES[cleanKey]) ? window.ARTIST_IMAGES[cleanKey] : null;
        }
        function getYTId(url) {
            if (!url || typeof url !== 'string') return null;
            const match = url.match(/(?:v=|\/|embed\/|shorts\/)([\w-]{11})/);
            return match ? match[1] : null;
        }

        function saveState() {
            localStorage.setItem('karaoke_favs', JSON.stringify([...favorites]));
            localStorage.setItem('karaoke_recents', JSON.stringify(recents));
            document.getElementById('favCount').innerText = favorites.size;
        }

        function deleteSong(event, id) {
            event.stopPropagation();
            const songId = String(id);
            const song = songs.find(s => String(s

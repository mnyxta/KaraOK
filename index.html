<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KaraOK</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="images_data.js"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .draggable-item { cursor: grab; }
        .draggable-item.dragging { opacity: 0.4; border-style: dashed; border-color: #f59e0b; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden" onload="initApp()">

    <!-- Header -->
    <header class="glass sticky top-0 z-20 px-4 py-3 flex flex-col md:flex-row gap-3 items-center justify-between shadow-xl">
        <div class="flex items-center gap-3 w-full md:w-auto justify-between">
            <!-- App Name & Logo -->
            <button onclick="showArtistsView()" class="hover:opacity-80 transition cursor-pointer flex items-center shrink-0">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" class="h-9 w-auto block">
                    <text x="0" y="70" font-family="'Arial Black', 'Inter', 'Montserrat', sans-serif" font-weight="900" font-size="78" fill="#FFFFFF" letter-spacing="-3">Kara</text>
                    <g transform="translate(202, 8)">
                        <circle cx="33" cy="33" r="32" fill="#FF3B30"/>
                        <circle cx="33" cy="33" r="18" fill="#0f172a"/>
                        <g fill="#FFFFFF">
                            <rect x="27" y="19" width="12" height="15" rx="6"/>
                            <path d="M 23 31 C 23 41, 43 41, 43 31" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
                            <rect x="31" y="39" width="4" height="6"/>
                            <path d="M 27 46 L 39 46 L 36 50 L 30 50 Z"/>
                        </g>
                    </g>
                    <text x="274" y="70" font-family="'Arial Black', 'Inter', 'Montserrat', sans-serif" font-weight="900" font-size="78" fill="#FF3B30" letter-spacing="-3">K</text>
                </svg>
            </button>
            
            <div class="flex items-center gap-2 overflow-x-auto hide-scrollbar">
                <!-- Import Button -->
                <label id="importBtn" class="hidden cursor-pointer bg-indigo-600 hover:bg-indigo-500 text-xs px-3 py-2 rounded-lg font-semibold transition items-center gap-2 shrink-0">
                    <i class="fa-solid fa-file-import"></i> <span>Import Playlist</span>
                    <input type="file" id="excelFile" accept=".xlsx, .xls" class="hidden" onchange="handleFileSelect(event)">
                </label>

                <!-- Add Song Button -->
                <button id="addSongBtn" onclick="openAddSongModal()" class="hidden bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-3 py-2 rounded-lg font-semibold transition items-center gap-2 shrink-0">
                    <i class="fa-solid fa-plus"></i> Add Song
                </button>

                <button onclick="pickRandomSong()" class="bg-amber-600 hover:bg-amber-500 text-white text-xs px-2.5 py-2 rounded-lg font-semibold transition flex items-center gap-1.5 shadow shrink-0">
                    <i class="fa-solid fa-shuffle"></i> Random Song
                </button>

                <!-- NEW: Filtered Random Button -->
                <button onclick="openFilteredRandomModal()" class="bg-amber-700 hover:bg-amber-600 text-white text-xs px-2.5 py-2 rounded-lg font-semibold transition flex items-center gap-1.5 shadow shrink-0">
                    <i class="fa-solid fa-filter-circle-dollar"></i> Filtered Random
                </button>

                <button onclick="pickRandomArtist()" class="bg-purple-600 hover:bg-purple-500 text-white text-xs px-2.5 py-2 rounded-lg font-semibold transition flex items-center gap-1.5 shadow shrink-0">
                    <i class="fa-solid fa-user-astronaut"></i> Random Artist
                </button>

                <button onclick="openSettingsModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs px-2.5 py-2 rounded-lg font-semibold transition flex items-center gap-1.5 shrink-0">
                    <i class="fa-solid fa-right-to-bracket"></i> Login
                </button>
            </div>
        </div>

        <!-- Search & Global Category Filter & Sort Options -->
        <div class="relative w-full md:w-auto flex flex-wrap sm:flex-nowrap items-center gap-2">
            <div class="relative flex-1 md:w-56">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input type="text" id="searchInput" oninput="handleSearch()" placeholder="Search artist, song, or album..." 
                       class="w-full bg-slate-900/80 border border-slate-700 rounded-xl pl-9 pr-4 py-2 text-sm focus:outline-none focus:border-indigo-500 transition">
            </div>

            <!-- Contextual Sort Dropdown -->
            <div id="sortControls" class="flex items-center bg-slate-900/90 px-2 py-1.5 rounded-xl border border-slate-700 text-xs text-slate-300 gap-1.5">
                <i class="fa-solid fa-arrow-down-wide-short text-indigo-400"></i>
                <select id="sortSelect" onchange="handleSortChange(this.value)" class="bg-transparent font-semibold focus:outline-none cursor-pointer text-xs text-white">
                    <!-- Populated dynamically based on active tab -->
                </select>
            </div>

            <!-- Global Category Toggle -->
            <div class="flex items-center bg-slate-900/90 p-1 rounded-xl border border-slate-700 text-xs font-semibold">
                <button id="catFilter-all" onclick="setCategoryFilter('all')" class="px-2.5 py-1 rounded-lg text-white bg-indigo-600 transition">Both</button>
                <button id="catFilter-mainstream" onclick="setCategoryFilter('mainstream')" class="px-2.5 py-1 rounded-lg text-slate-400 hover:text-white transition flex items-center gap-1">
                    <span class="w-2 h-2 rounded-full bg-pink-500 inline-block"></span> Main
                </button>
                <button id="catFilter-alternative" onclick="setCategoryFilter('alternative')" class="px-2.5 py-1 rounded-lg text-slate-400 hover:text-white transition flex items-center gap-1">
                    <span class="w-2 h-2 rounded-full bg-teal-400 inline-block"></span> Alt
                </button>
            </div>
        </div>

        <div class="flex items-center gap-2 w-full md:w-auto justify-center overflow-x-auto hide-scrollbar">
            <button onclick="showArtistsView()" id="tab-artists" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-indigo-600 text-white transition">Artists</button>
            <button onclick="showAllSongsView()" id="tab-all" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 transition">All Songs</button>
            <button onclick="showFavsView()" id="tab-favs" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 transition">Favorites (<span id="favCount">0</span>)</button>
            <button onclick="showRecentsView()" id="tab-recents" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 transition">Recents</button>
            <!-- Admin Only Tab -->
            <button onclick="showTodoView()" id="tab-todo" class="hidden tab-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-amber-600/30 text-amber-300 hover:bg-amber-600 hover:text-white transition flex items-center gap-1.5 border border-amber-500/40">
                <i class="fa-solid fa-list-check"></i> To Add (<span id="todoCount">0</span>)
            </button>
        </div>
    </header>

    <!-- Sync Toast Status -->
    <div id="syncToast" class="hidden fixed bottom-4 right-4 z-50 bg-indigo-600 text-white text-xs px-4 py-2.5 rounded-xl shadow-2xl items-center gap-2 font-semibold">
        <i class="fa-solid fa-circle-notch animate-spin"></i> <span id="syncToastText">Syncing with GitHub...</span>
    </div>

    <!-- Artist Breadcrumb -->
    <div id="artistBreadcrumb" class="hidden glass px-6 py-2.5 flex items-center justify-between border-b border-slate-800">
        <button onclick="showArtistsView()" class="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg text-slate-200 font-semibold flex items-center gap-2">
            <i class="fa-solid fa-arrow-left"></i> Back to Artists
        </button>
        <div class="flex items-center gap-2">
            <span id="selectedArtistName" class="text-base font-bold text-indigo-400"></span>
            <span id="selectedArtistCategory" class="text-xs px-2 py-0.5 rounded-md font-bold uppercase"></span>
            <span id="selectedArtistCount" class="text-xs bg-indigo-600/30 text-indigo-300 px-2.5 py-0.5 rounded-full font-semibold"></span>
        </div>
    </div>

    <main id="mainScrollContainer" class="flex-1 overflow-y-auto p-4 md:p-6">
        <div id="mainContainer"></div>
        <div id="emptyState" class="hidden flex-col items-center justify-center py-20 text-slate-500">
            <i class="fa-solid fa-compact-disc text-5xl mb-3 animate-spin"></i>
            <p id="emptyMessage" class="text-sm">Loading database...</p>
        </div>
    </main>

    <!-- Settings Modal -->
    <div id="settingsModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
        <div class="glass max-w-md w-full rounded-2xl p-6 shadow-2xl relative border border-slate-700">
            <button onclick="closeSettingsModal()" class="absolute top-3 right-3 text-slate-400 hover:text-white p-2 text-sm"><i class="fa-solid fa-xmark"></i></button>
            <h3 class="text-lg font-bold text-white mb-1"><i class="fa-solid fa-right-to-bracket text-indigo-400 mr-2"></i>Admin Login & Database Sync</h3>
            <p class="text-xs text-slate-400 mb-4">Enter your GitHub Access Token to enable editing features and sync songs/favorites to GitHub.</p>
            
            <div class="space-y-3 text-xs">
                <div>
                    <label class="block text-slate-300 mb-1 font-semibold">GitHub Username</label>
                    <input type="text" id="ghOwner" placeholder="e.g. jondoe" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white">
                </div>
                <div>
                    <label class="block text-slate-300 mb-1 font-semibold">Repository Name</label>
                    <input type="text" id="ghRepo" placeholder="e.g. karaoke-hub" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white">
                </div>
                <div>
                    <label class="block text-slate-300 mb-1 font-semibold">Personal Access Token</label>
                    <input type="password" id="ghToken" placeholder="github_pat_..." class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white">
                </div>
            </div>

            <div class="flex gap-2 mt-6">
                <button onclick="saveSettings()" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white py-2 rounded-xl text-xs font-semibold">Save Settings</button>
                <button onclick="closeSettingsModal()" class="bg-slate-800 text-slate-300 px-4 py-2 rounded-xl text-xs font-semibold">Cancel</button>
            </div>
        </div>
    </div>

    <!-- NEW: Filtered Random Modal -->
    <div id="filteredRandomModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
        <div class="glass max-w-sm w-full rounded-2xl p-6 shadow-2xl relative border border-slate-700">
            <button onclick="closeFilteredRandomModal()" class="absolute top-3 right-3 text-slate-400 hover:text-white p-2 text-sm"><i class="fa-solid fa-xmark"></i></button>
            <h3 class="text-lg font-bold text-white mb-1"><i class="fa-solid fa-filter-circle-dollar text-amber-500 mr-2"></i>Favorites Random Filter</h3>
            <p class="text-xs text-slate-400 mb-4">Pick a random favorite song within a specified rating score range.</p>
            
            <div class="space-y-3 text-xs mb-6">
                <div>
                    <label class="block text-slate-300 mb-1 font-semibold">Minimum Rating (1-10)</label>
                    <select id="filterMinRating" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white font-semibold">
                        <option value="1">1 pt</option>
                        <option value="2">2 pts</option>
                        <option value="3">3 pts</option>
                        <option value="4

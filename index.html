<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karaoke Song Picker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="images_data.js"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden" onload="initApp()">

    <!-- Header -->
    <header class="glass sticky top-0 z-20 px-4 py-3 flex flex-col md:flex-row gap-3 items-center justify-between shadow-xl">
        <div class="flex items-center gap-3 w-full md:w-auto justify-between">
            <h1 class="text-xl font-bold tracking-wider text-indigo-400 flex items-center gap-2">
                <i class="fa-solid fa-microphone-lines text-pink-500"></i> KARAOKE HUB
            </h1>
            <div class="flex items-center gap-2">
                <!-- Import Button -->
                <label id="importBtn" class="hidden cursor-pointer bg-indigo-600 hover:bg-indigo-500 text-xs px-3 py-2 rounded-lg font-semibold transition items-center gap-2">
                    <i class="fa-solid fa-file-import"></i> <span>Import Playlist</span>
                    <input type="file" id="excelFile" accept=".xlsx, .xls" class="hidden" onchange="handleFileSelect(event)">
                </label>

                <!-- Add Song Button -->
                <button id="addSongBtn" onclick="openAddSongModal()" class="hidden bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-3 py-2 rounded-lg font-semibold transition items-center gap-2">
                    <i class="fa-solid fa-plus"></i> Add Song
                </button>

                <button onclick="pickRandomSong()" class="bg-amber-600 hover:bg-amber-500 text-white text-xs px-2.5 py-2 rounded-lg font-semibold transition flex items-center gap-1.5 shadow">
                    <i class="fa-solid fa-shuffle"></i> Random
                </button>

                <button onclick="openSettingsModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs px-2.5 py-2 rounded-lg font-semibold transition flex items-center gap-1.5">
                    <i class="fa-solid fa-gear"></i> Sync Settings
                </button>
            </div>
        </div>

        <div class="relative w-full md:w-96 flex items-center gap-1.5">
            <div class="relative flex-1">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input type="text" id="searchInput" oninput="handleSearch()" placeholder="Search artist, song, or album..." 
                       class="w-full bg-slate-900/80 border border-slate-700 rounded-xl pl-9 pr-4 py-2 text-sm focus:outline-none focus:border-indigo-500 transition">
            </div>
        </div>

        <div class="flex items-center gap-2 w-full md:w-auto justify-center overflow-x-auto hide-scrollbar">
            <button onclick="showArtistsView()" id="tab-artists" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-indigo-600 text-white transition">Artists</button>
            <button onclick="showAllSongsView()" id="tab-all" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 transition">All Songs</button>
            <button onclick="showFavsView()" id="tab-favs" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 transition">Favorites (<span id="favCount">0</span>)</button>
            <button onclick="showRecentsView()" id="tab-recents" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 transition">Recents</button>
        </div>
    </header>

    <!-- Sync Toast Status -->
    <div id="syncToast" class="hidden fixed bottom-4 right-4 z-50 bg-indigo-600 text-white text-xs px-4 py-2.5 rounded-xl shadow-2xl items-center gap-2 font-semibold">
        <i class="fa-solid fa-circle-notch animate-spin"></i> <span id="syncToastText">Syncing with GitHub...</span>
    </div>

    <!-- Artist Breadcrumb -->
    <div id="artistBreadcrumb" class="hidden glass px-6 py-2.5 flex items-center justify-between border-b border-slate-800">
        <button onclick="showArtistsView()" class="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg text-slate-200 font-semibold flex items-center gap-2">
            <i class="fa-solid fa-arrow-left"></i> Back to Artists
        </button>
        <div class="flex items-center gap-2">
            <span id="selectedArtistName" class="text-base font-bold text-indigo-400"></span>
            <span id="selectedArtistCount" class="text-xs bg-indigo-600/30 text-indigo-300 px-2.5 py-0.5 rounded-full font-semibold"></span>
        </div>
    </div>

    <main class="flex-1 overflow-y-auto p-4 md:p-6">
        <div id="mainContainer"></div>
        <div id="emptyState" class="hidden flex-col items-center justify-center py-20 text-slate-500">
            <i class="fa-solid fa-compact-disc text-5xl mb-3 animate-spin"></i>
            <p id="emptyMessage" class="text-sm">Loading database...</p>
        </div>
    </main>

    <!-- Settings Modal -->
    <div id="settingsModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
        <div class="glass max-w-md w-full rounded-2xl p-6 shadow-2xl relative border border-slate-700">
            <button onclick="closeSettingsModal()" class="absolute top-3 right-3 text-slate-400 hover:text-white p-2 text-sm"><i class="fa-solid fa-xmark"></i></button>
            <h3 class="text-lg font-bold text-white mb-1"><i class="fa-solid fa-cloud-arrow-up text-indigo-400 mr-2"></i>GitHub Database Sync</h3>
            <p class="text-xs text-slate-400 mb-4">Enter your GitHub Access Token to enable editing features and sync songs/favorites to GitHub[cite: 1].</p>
            
            <div class="space-y-3 text-xs">
                <div>
                    <label class="block text-slate-300 mb-1 font-semibold">GitHub Username</label>
                    <input type="text" id="ghOwner" placeholder="e.g. jondoe" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white">
                </div>
                <div>
                    <label class="block text-slate-300 mb-1 font-semibold">Repository Name</label>
                    <input type="text" id="ghRepo" placeholder="e.g. karaoke-hub" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white">
                </div>
                <div>
                    <label class="block text-slate-300 mb-1 font-semibold">Personal Access Token</label>
                    <input type="password" id="ghToken" placeholder="github_pat_..." class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white">
                </div>
            </div>

            <div class="flex gap-2 mt-6">
                <button onclick="saveSettings()" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white py-2 rounded-xl text-xs font-semibold">Save Settings</button>
                <button onclick="closeSettingsModal()" class="bg-slate-800 text-slate-300 px-4 py-2 rounded-xl text-xs font-semibold">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Add Song Modal -->
    <div id="addSongModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
        <div class="glass max-w-md w-full rounded-2xl p-6 shadow-2xl relative border border-slate-700">
            <button onclick="closeAddSongModal()" class="absolute top-3 right-3 text-slate-400 hover:text-white p-2 text-sm"><i class="fa-solid fa-xmark"></i></button>
            <h3 class="text-lg font-bold text-white mb-1"><i class="fa-solid fa-music text-indigo-400 mr-2"></i>Add New Song</h3>
            <p class="text-xs text-slate-400 mb-4">Manually add a track to your library and upload an artist cover image.</p>
            
            <div class="space-y-3 text-xs">
                <div>
                    <label class="block text-slate-300 mb-1 font-semibold">Artist Name *</label>
                    <input type="text" id="newArtist" placeholder="e.g. Queen" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white">
                </div>
                <div>
                    <label class="block text-slate-300 mb-1 font-semibold">Song Title *</label>
                    <input type="text" id="newTitle" placeholder="e.g. Bohemian Rhapsody" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white">
                </div>
                <div>
                    <label class="block text-slate-300 mb-1 font-semibold">Album Name</label>
                    <input type="text" id="newAlbum" placeholder="e.g. A Night at the Opera" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white">
                </div>
                <div>
                    <label class="block text-slate-300 mb-1 font-semibold">YouTube URL or Video ID *</label>
                    <input type="text" id="newLink" placeholder="https://www.youtube.com/watch?v=..." class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white">
                </div>
                <div>
                    <label class="block text-slate-300 mb-1 font-semibold">Artist Image (Optional)</label>
                    <input type="file" id="newImageFile" accept="image/*" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-slate-300 file:mr-3 file:py-1 file:px-2.5 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500">
                </div>
            </div>

            <div class="flex gap-2 mt-6">
                <button onclick="handleAddSong()" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white py-2 rounded-xl text-xs font-semibold">Add & Sync</button>
                <button onclick="closeAddSongModal()" class="bg-slate-800 text-slate-300 px-4 py-2 rounded-xl text-xs font-semibold">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Random Modal -->
    <div id="randomModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
        <div class="glass max-w-md w-full rounded-2xl p-6 flex flex-col items-center text-center shadow-2xl relative border border-slate-700">
            <button onclick="closeRandomModal()" class="absolute top-3 right-3 text-slate-400 hover:text-white p-2 text-sm"><i class="fa-solid fa-xmark"></i></button>
            <div class="text-amber-500 font-bold text-xs uppercase tracking-wider mb-3"><i class="fa-solid fa-dice mr-1"></i> Random Pick</div>
            <div id="randomImageContainer" class="w-32 h-32 rounded-xl overflow-hidden mb-4 bg-slate-800 flex items-center justify-center border border-slate-700"></div>
            <h3 id="randomSongTitle" class="text-lg font-bold text-white mb-1"></h3>
            <p id="randomSongArtist" class="text-sm text-indigo-400 font-semibold mb-1"></p>
            <p id="randomSongAlbum" class="text-xs text-slate-400 font-medium mb-6 flex items-center gap-1"><i class="fa-solid fa-compact-disc"></i> <span></span></p>
            <div class="flex items-center gap-3 w-full">
                <button onclick="pickRandomSong()" class="flex-1 bg-slate-800 text-slate-200 py-2.5 rounded-xl font-semibold text-xs border border-slate-700">Pick Another</button>
                <button id="randomPlayBtn" class="flex-1 bg-indigo-600 text-white py-2.5 rounded-xl font-semibold text-xs">Play Karaoke</button>
            </div>
        </div>
    </div>

    <script>
        window.ARTIST_IMAGES = window.ARTIST_IMAGES || {};

        let songs = [];
        let favorites = new Set(JSON.parse(localStorage.getItem('karaoke_favs') || '[]'));
        let recents = JSON.parse(localStorage.getItem('karaoke_recents') || '[]');
        let currentMode = 'artists'; 
        let selectedArtist = null;

        function hasAdminAccess() {
            const token = localStorage.getItem('gh_token');
            return !!(token && token.trim().length > 0);
        }

        function updateAdminUI() {
            const importBtn = document.getElementById('importBtn');
            const addSongBtn = document.getElementById('addSongBtn');
            const isAdmin = hasAdminAccess();

            if (isAdmin) {
                importBtn.classList.remove('hidden'); importBtn.classList.add('flex');
                addSongBtn.classList.remove('hidden'); addSongBtn.classList.add('flex');
            } else {
                importBtn.classList.add('hidden'); importBtn.classList.remove('flex');
                addSongBtn.classList.add('hidden'); addSongBtn.classList.remove('flex');
            }
        }

        async function initApp() {
            document.getElementById('ghOwner').value = localStorage.getItem('gh_owner') || '';
            document.getElementById('ghRepo').value = localStorage.getItem('gh_repo') || '';
            document.getElementById('ghToken').value = localStorage.getItem('gh_token') || '';

            updateAdminUI();

            // Fetch remote favorites if logged in as Admin
            if (hasAdminAccess()) {
                await fetchAdminFavorites();
            }

            try {
                const response = await fetch('songs.json?cache_bust=' + Date.now());
                if (response.ok) {
                    songs = await response.json();
                    showArtistsView();
                    return;
                }
            } catch (e) {
                console.warn("Could not fetch songs.json, checking cached memory.", e);
            }

            const cached = localStorage.getItem('karaoke_cached_songs');
            if (cached) {
                try { songs = JSON.parse(cached); } catch(e) { songs = []; }
            }
            showArtistsView();
        }

        // Fetch Favorites tied to your GitHub Repository
        async function fetchAdminFavorites() {
            const owner = localStorage.getItem('gh_owner');
            const repo = localStorage.getItem('gh_repo');
            const token = localStorage.getItem('gh_token');

            if (!owner || !repo || !token) return;

            try {
                const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/favorites.json`, {
                    headers: { 'Authorization': `token ${token}` }
                });
                if (res.ok) {
                    const data = await res.json();
                    const contentStr = decodeURIComponent(escape(atob(data.content)));
                    const remoteFavs = JSON.parse(contentStr);
                    if (Array.isArray(remoteFavs)) {
                        // Merge remote favorites with any existing local ones
                        remoteFavs.forEach(id => favorites.add(id));
                        saveState();
                    }
                }
            } catch (e) {
                console.warn("No remote favorites found or fetch failed. Will create on next save.", e);
            }
        }

        // Sync Favorites specifically to favorites.json on GitHub
        async function saveFavsToGitHub() {
            const owner = localStorage.getItem('gh_owner');
            const repo = localStorage.getItem('gh_repo');
            const token = localStorage.getItem('gh_token');

            if (!owner || !repo || !token) return;

            try {
                const favArray = Array.from(favorites);
                await updateGitHubFile(owner, repo, token, 'favorites.json', JSON.stringify(favArray, null, 2));
            } catch (err) {
                console.error("Failed to sync favorites to GitHub:", err);
            }
        }

        // Automatic GitHub sync for songs and images_data.js
        async function saveToGitHub(newSongsList, newImageData = null) {
            const owner = localStorage.getItem('gh_owner');
            const repo = localStorage.getItem('gh_repo');
            const token = localStorage.getItem('gh_token');

            localStorage.setItem('karaoke_cached_songs', JSON.stringify(newSongsList));

            if (!owner || !repo || !token) {
                console.warn("GitHub credentials missing. Saved locally in current browser.");
                return;
            }

            const toast = document.getElementById('syncToast');
            const toastText = document.getElementById('syncToastText');
            toast.classList.remove('hidden'); toast.classList.add('flex');
            toastText.innerText = "Syncing with GitHub...";

            try {
                await updateGitHubFile(owner, repo, token, 'songs.json', JSON.stringify(newSongsList, null, 2));

                if (newImageData) {
                    const jsContent = `window.ARTIST_IMAGES = ${JSON.stringify(window.ARTIST_IMAGES, null, 2)};`;
                    await updateGitHubFile(owner, repo, token, 'images_data.js', jsContent);
                }

                toastText.innerText = "Synced to GitHub!";
                setTimeout(() => toast.classList.add('hidden'), 2500);
            } catch (err) {
                console.error("GitHub Sync Failed:", err);
                toastText.innerText = "Sync failed. Check Token settings.";
                setTimeout(() => toast.classList.add('hidden'), 4000);
            }
        }

        async function updateGitHubFile(owner, repo, token, filePath, stringContent) {
            const getFile = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${filePath}`, {
                headers: { 'Authorization': `token ${token}` }
            });

            let sha = "";
            if (getFile.ok) {
                const data = await getFile.json();
                sha = data.sha;
            }

            const content = btoa(unescape(encodeURIComponent(stringContent)));
            const putResponse = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${filePath}`, {
                method: 'PUT',
                headers: {
                    'Authorization': `token ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    message: `Update ${filePath} via Karaoke Hub`,
                    content: content,
                    sha: sha !== "" ? sha : undefined
                })
            });

            if (!putResponse.ok) throw new Error(`API returned status ${putResponse.status}`);
        }

        function openSettingsModal() { document.getElementById('settingsModal').classList.remove('hidden'); }
        function closeSettingsModal() { document.getElementById('settingsModal').classList.add('hidden'); }

        async function saveSettings() {
            localStorage.setItem('gh_owner', document.getElementById('ghOwner').value.trim());
            localStorage.setItem('gh_repo', document.getElementById('ghRepo').value.trim());
            localStorage.setItem('gh_token', document.getElementById('ghToken').value.trim());
            
            updateAdminUI(); 
            if (hasAdminAccess()) {
                await fetchAdminFavorites();
            }
            closeSettingsModal(); 
            render();
        }

        function openAddSongModal() {
            document.getElementById('newArtist').value = '';
            document.getElementById('newTitle').value = '';
            document.getElementById('newAlbum').value = '';
            document.getElementById('newLink').value = '';
            document.getElementById('newImageFile').value = '';
            document.getElementById('addSongModal').classList.remove('hidden');
        }

        function closeAddSongModal() { document.getElementById('addSongModal').classList.add('hidden'); }

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
                reader.readAsDataURL(file);
            });
        }

        async function handleAddSong() {
            if (!hasAdminAccess()) return;

            const artist = document.getElementById('newArtist').value.trim();
            const title = document.getElementById('newTitle').value.trim();
            const album = document.getElementById('newAlbum').value.trim() || 'Single';
            const link = document.getElementById('newLink').value.trim();
            const imageInput = document.getElementById('newImageFile');

            if (!artist || !title || !link) {
                alert("Please fill in Artist, Title, and YouTube Link.");
                return;
            }

            const ytId = getYTId(link);
            if (!ytId) {
                alert("Invalid YouTube link. Please provide a valid link or 11-character video ID.");
                return;
            }

            let hasNewImage = false;
            if (imageInput.files && imageInput.files[0]) {
                try {
                    const base64Data = await fileToBase64(imageInput.files[0]);
                    const cleanKey = cleanArtistName(artist).replace(/[^a-zA-Z0-9_\-]/g, '_').toLowerCase();
                    window.ARTIST_IMAGES[cleanKey] = base64Data;
                    hasNewImage = true;
                } catch (e) {
                    console.error("Image read failed:", e);
                }
            }

            const newId = songs.length > 0 ? Math.max(...songs.map(s => Number(s.id) || 0)) + 1 : 1;
            const newSong = { id: newId, artist, title, album, link, ytId };
            songs.push(newSong);

            saveState();
            saveToGitHub(songs, hasNewImage);
            closeAddSongModal();
            render();
        }

        function cleanArtistName(rawName) { 
            return (rawName || '').split(/ feat\.?| ft\.?| & |,|\/| starring/i)[0].trim(); 
        }

        function getArtistBase64Image(rawArtistName) {
            if (!rawArtistName) return null;
            const cleanKey = cleanArtistName(rawArtistName).replace(/[^a-zA-Z0-9_\-]/g, '_').toLowerCase();
            return (window.ARTIST_IMAGES && window.ARTIST_IMAGES[cleanKey]) ? window.ARTIST_IMAGES[cleanKey] : null;
        }

        function getYTId(url) {
            if (!url || typeof url !== 'string') return null;
            const match = url.match(/(?:v=|\/|embed\/|shorts\/)([\w-]{11})/);
            return match ? match[1] : (url.length === 11 ? url : null);
        }

        function saveState() {
            localStorage.setItem('karaoke_favs', JSON.stringify([...favorites]));
            localStorage.setItem('karaoke_recents', JSON.stringify(recents));
            document.getElementById('favCount').innerText = favorites.size;
        }

        function deleteSong(event, id) {
            event.stopPropagation();
            if (!hasAdminAccess()) return;

            const song = songs.find(s => s.id === id);
            if (!song) return;

            if (confirm(`Remove "${song.title}" by ${song.artist}?`)) {
                songs = songs.filter(s => s.id !== id);
                favorites.delete(id);
                recents = recents.filter(s => s.id !== id);
                saveState();
                saveToGitHub(songs);
                if (hasAdminAccess()) saveFavsToGitHub();

                if (currentMode === 'artist_songs') {
                    const remaining = songs.filter(s => s.artist === selectedArtist);
                    if (remaining.length === 0) { showArtistsView(); return; }
                }
                render();
            }
        }

        function handleFileSelect(event) {
            if (!hasAdminAccess()) return;
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                const rawRows = XLSX.utils.sheet_to_json(firstSheet);

                songs = rawRows.map((r, i) => {
                    const artist = String(r['Artist'] || r['artist'] || '').trim();
                    const title = String(r['Song Title'] || r['Title'] || r['title'] || '').trim();
                    const album = String(r['Album'] || r['album'] || 'Single').trim();
                    const link = String(r['YouTube Link'] || r['Link'] || r['link'] || '').trim();
                    const ytId = getYTId(link);

                    return { id: i + 1, artist, title, album, link, ytId };
                }).filter(s => s.artist && s.title && s.ytId);

                saveState();
                saveToGitHub(songs);
                showArtistsView();
            };
            reader.readAsArrayBuffer(file);
        }

        function setActiveTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(b => {
                b.classList.remove('bg-indigo-600', 'text-white');
                b.classList.add('bg-slate-800', 'text-slate-300');
            });
            if (tabId && document.getElementById(tabId)) {
                document.getElementById(tabId).classList.add('bg-indigo-600', 'text-white');
            }
        }

        function showArtistsView() { currentMode = 'artists'; selectedArtist = null; document.getElementById('artistBreadcrumb').classList.add('hidden'); setActiveTab('tab-artists'); render(); }
        function showAllSongsView() { currentMode = 'all_songs'; selectedArtist = null; document.getElementById('artistBreadcrumb').classList.add('hidden'); setActiveTab('tab-all'); render(); }
        function showFavsView() { currentMode = 'favs'; selectedArtist = null; document.getElementById('artistBreadcrumb').classList.add('hidden'); setActiveTab('tab-favs'); render(); }
        function showRecentsView() { currentMode = 'recents'; selectedArtist = null; document.getElementById('artistBreadcrumb').classList.add('hidden'); setActiveTab('tab-recents'); render(); }

        function selectArtist(artistName) {
            currentMode = 'artist_songs'; selectedArtist = artistName;
            document.getElementById('searchInput').value = '';
            document.getElementById('artistBreadcrumb').classList.remove('hidden');
            document.getElementById('selectedArtistName').innerText = artistName;
            setActiveTab(null); render();
        }

        function handleSearch() { render(); }

        function toggleFav(event, id) {
            event.stopPropagation();
            if (favorites.has(id)) favorites.delete(id);
            else favorites.add(id);
            
            saveState();
            if (hasAdminAccess()) {
                saveFavsToGitHub();
            }
            render();
        }

        function playSong(song) {
            if (!song || !song.ytId) return;
            recents = [song, ...recents.filter(s => s.id !== song.id)].slice(0, 30);
            saveState();
            window.open(`https://www.youtube.com/watch?v=${song.ytId}`, '_blank');
        }

        function pickRandomSong() {
            const available = songs.filter(s => s.ytId);
            if (available.length === 0) return alert("Playlist empty!");
            const currentRandomSong = available[Math.floor(Math.random() * available.length)];

            document.getElementById('randomSongTitle').innerText = currentRandomSong.title;
            document.getElementById('randomSongArtist').innerText = currentRandomSong.artist;
            document.getElementById('randomSongAlbum').querySelector('span').innerText = currentRandomSong.album;

            const base64Img = getArtistBase64Image(currentRandomSong.artist);
            const imgContainer = document.getElementById('randomImageContainer');
            imgContainer.innerHTML = base64Img 
                ? `<img src="${base64Img}" class="w-full h-full object-cover">` 
                : `<i class="fa-solid fa-music text-4xl text-slate-500"></i>`;

            document.getElementById('randomPlayBtn').onclick = function() { playSong(currentRandomSong); closeRandomModal(); };
            document.getElementById('randomModal').classList.remove('hidden');
        }

        function closeRandomModal() { document.getElementById('randomModal').classList.add('hidden'); }

        function render() {
            const container = document.getElementById('mainContainer');
            const emptyState = document.getElementById('emptyState');
            const search = (document.getElementById('searchInput').value || '').trim().toLowerCase();
            document.getElementById('favCount').innerText = favorites.size;
            const isAdmin = hasAdminAccess();

            const availableSongs = songs.filter(s => s && s.ytId);

            if (availableSongs.length === 0) {
                container.innerHTML = '';
                emptyState.classList.remove('hidden'); emptyState.classList.add('flex');
                document.getElementById('emptyMessage').innerText = isAdmin 
                    ? 'No songs loaded. Add a song or import a playlist.'
                    : 'No songs available.';
                return;
            }

            emptyState.classList.add('hidden'); emptyState.classList.remove('flex');

            if (currentMode === 'artists') {
                const artistMap = {};
                availableSongs.forEach(s => { 
                    if (s.artist) (artistMap[s.artist] = artistMap[s.artist] || []).push(s); 
                });
                let names = Object.keys(artistMap).sort((a,b) => artistMap[b].length - artistMap[a].length);

                if (search) {
                    names = names.filter(n => n.toLowerCase().includes(search) || artistMap[n].some(s => s.title.toLowerCase().includes(search)));
                }

                const gridHtml = names.map(name => {
                    const count = artistMap[name].length;
                    const base64Img = getArtistBase64Image(name);
                    const imageHtml = base64Img 
                        ? `<img src="${base64Img}" class="w-full h-full object-cover group-hover:scale-105 transition">`
                        : `<div class="w-full h-full bg-slate-800 flex items-center justify-center text-slate-600"><i class="fa-solid fa-user text-5xl"></i></div>`;

                    const escapedName = name.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                    return `
                        <div onclick="selectArtist('${escapedName}')" class="glass rounded-xl overflow-hidden cursor-pointer hover:border-indigo-500/50 hover:scale-[1.02] transition flex flex-col group relative">
                            <div class="relative h-44 w-full bg-slate-900 overflow-hidden">
                                ${imageHtml}
                                <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/20 to-transparent"></div>
                                <div class="absolute top-2 right-2 bg-indigo-600/90 text-xs font-bold px-2 py-0.5 rounded-full text-white">${count} ${count === 1 ? 'song' : 'songs'}</div>
                            </div>
                            <div class="p-3 flex items-center justify-between">
                                <h3 class="font-bold text-sm text-slate-100 group-hover:text-indigo-400 truncate">${name}</h3>
                                <i class="fa-solid fa-chevron-right text-xs text-slate-500"></i>
                            </div>
                        </div>`;
                }).join('');

                container.innerHTML = `<div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4">${gridHtml}</div>`;
                return;
            }

            if (currentMode === 'artist_songs') {
                let artistSongs = availableSongs.filter(s => s.artist === selectedArtist);
                if (search) artistSongs = artistSongs.filter(s => s.title.toLowerCase().includes(search));
                document.getElementById('selectedArtistCount').innerText = `${artistSongs.length} songs`;

                const listHtml = artistSongs.map((song, i) => `
                    <div onclick="playSong(${JSON.stringify(song).replace(/"/g, '&quot;')})" class="glass rounded-xl p-3.5 px-4 flex items-center justify-between cursor-pointer hover:border-indigo-500/50 hover:bg-slate-800/80 transition group">
                        <div class="flex items-center gap-3.5 min-w-0 pr-4">
                            <span class="text-xs font-semibold text-slate-500 w-6 text-right">${i + 1}</span>
                            <i class="fa-solid fa-circle-play text-indigo-400 text-lg"></i>
                            <div class="flex flex-col min-w-0">
                                <span class="font-semibold text-sm text-slate-100 group-hover:text-indigo-300 truncate">${song.title}</span>
                                <span class="text-xs text-slate-400 font-medium truncate">${song.album}</span>
                            </div>
                        </div>
                        <div class="flex items-center gap-2 shrink-0">
                            <button onclick="toggleFav(event, ${song.id})" class="p-2 rounded-lg bg-slate-800 text-slate-400 hover:text-pink-400"><i class="fa-${favorites.has(song.id) ? 'solid text-pink-500' : 'regular'} fa-heart text-sm"></i></button>
                            ${isAdmin ? `<button onclick="deleteSong(event, ${song.id})" class="p-2 rounded-lg bg-slate-800 text-slate-400 hover:text-red-400"><i class="fa-solid fa-trash-can text-sm"></i></button>` : ''}
                        </div>
                    </div>`).join('');

                container.innerHTML = `<div class="max-w-4xl mx-auto flex flex-col gap-2">${listHtml}</div>`;
                return;
            }

            let songList = currentMode === 'favs' ? availableSongs.filter(s => favorites.has(s.id))
                         : currentMode === 'recents' ? recents.filter(s => s.ytId)
                         : [...availableSongs];

            if (search) {
                songList = songList.filter(s => (s.artist || '').toLowerCase().includes(search) || (s.title || '').toLowerCase().includes(search) || (s.album || '').toLowerCase().includes(search));
            }

            const gridHtml = songList.map(song => {
                const base64Img = getArtistBase64Image(song.artist);
                const imageHtml = base64Img 
                    ? `<img src="${base64Img}" class="w-full h-full object-cover group-hover:scale-105 transition">` 
                    : `<div class="w-full h-full bg-slate-800 flex items-center justify-center text-slate-600"><i class="fa-solid fa-music text-4xl"></i></div>`;

                return `
                    <div onclick="playSong(${JSON.stringify(song).replace(/"/g, '&quot;')})" class="glass rounded-xl overflow-hidden cursor-pointer hover:border-indigo-500/50 hover:scale-[1.02] transition flex flex-col group relative">
                        <div class="relative h-36 w-full bg-slate-900 overflow-hidden">
                            ${imageHtml}
                            <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/20 to-transparent"></div>
                            <div class="absolute top-2 right-2 flex items-center gap-1 z-10">
                                <button onclick="toggleFav(event, ${song.id})" class="p-2 rounded-full bg-slate-950/60 text-slate-300 hover:text-pink-500"><i class="fa-${favorites.has(song.id) ? 'solid text-pink-500' : 'regular'} fa-heart text-sm"></i></button>
                                ${isAdmin ? `<button onclick="deleteSong(event, ${song.id})" class="p-2 rounded-full bg-slate-950/60 text-slate-300 hover:text-red-400"><i class="fa-solid fa-trash-can text-sm"></i></button>` : ''}
                            </div>
                        </div>
                        <div class="p-3 flex flex-col justify-between flex-1">
                            <h3 class="font-bold text-sm line-clamp-1 text-slate-100 group-hover:text-indigo-400">${song.title}</h3>
                            <p class="text-xs text-slate-400 line-clamp-1 mt-0.5">${song.artist}</p>
                        </div>
                    </div>`;
            }).join('');

            container.innerHTML = `<div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4">${gridHtml}</div>`;
        }
    </script>
</body>
</html>
